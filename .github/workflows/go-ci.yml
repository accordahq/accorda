name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Start Docker daemon
        run: |
          sudo systemctl start docker
          docker info

      - name: Run full validation
        run: scripts/test.sh

      - name: Scan reachable Go vulnerabilities
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: "1.25.13"
          go-package: ./...
          work-dir: src/accorda
          repo-checkout: false
          cache-dependency-path: src/accorda/go.sum
          output-format: json
          output-file: /tmp/accorda-govulncheck.json

      - name: Reject unaccepted reachable vulnerabilities
        run: |
          unexpected="$(jq -rs '
            [.[].finding
              | select(. != null and ((.trace[0].function // "") != ""))
              | .osv
              | select(. != "GO-2026-4883" and . != "GO-2026-4887")]
            | unique | .[]' /tmp/accorda-govulncheck.json)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected reachable vulnerabilities:"
            echo "$unexpected"
            exit 1
          fi
