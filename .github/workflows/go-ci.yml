name: Go CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check formatting
        run: |
          find src/accorda -name '*.go' -print0 | xargs -0 gofmt -w
          git diff --exit-code -- src/accorda

      - name: Run tests
        run: |
          cd src/accorda
          go test ./...

      - name: Build
        run: |
          cd src/accorda
          go build ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Start Docker daemon
        run: |
          sudo systemctl start docker
          docker info

      - name: Run integration tests
        run: |
          cd src/accorda
          go test -tags integration ./...
