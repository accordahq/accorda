# Local composite action that checks out the repository and installs the
# pinned Go toolchain with a correctly-keyed module cache.
#
# This deduplicates the checkout + setup-go steps shared by every CI job. It
# pins the toolchain explicitly (docs/DECISIONS.md #24): the module's `go`
# directive stays at the true minimum (1.25.0), while CI needs 1.25.6+ where
# go-git's `file://` transport works. The cache is keyed on the actual module
# file (`src/accorda/go.sum`) via `cache-dependency-path` so
# actions/setup-go can locate the dependency file in this monorepo layout;
# without it, setup-go warns that no `go.mod` is found at the repo root and
# the module cache is never restored.
name: Set up Go

description: Check out code and install the pinned Go toolchain with a module cache keyed on the real dependency file.

inputs:
  go-version:
    description: Go toolchain version to install.
    required: true
    default: "1.25.6"

runs:
  using: composite
  steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: "**/go.sum"
